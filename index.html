<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e0b">
<title>VeloTrack</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
 
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0e0b;--s1:#141410;--s2:#1a1a15;--s3:#202018;
  --line:#ffffff08;--line2:#ffffff12;--line3:#ffffff1e;
  --white:#ede8df;--dim:#5a5a52;--mid:#8a8a7e;
  --accent:#d4c5a0;--green:#7aab7a;--red:#c46060;
  --mono:'IBM Plex Mono','Courier New',monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:var(--sans);}
 
/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}
 
/* ── BOTTOM NAV ── */
.bnav{
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 max(16px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg);
  flex-shrink:0;z-index:100;
}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 20px;}
.ni svg{fill:var(--dim);transition:fill .2s;}
.ni span{font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);transition:color .2s;}
.ni.on svg{fill:var(--accent);}
.ni.on span{color:var(--accent);}
 
/* ── RIDE SCREEN ── */
#screen-ride{overflow:hidden;}
#map-wrap{
  position:relative;
  height:45vh;
  min-height:200px;
  flex-shrink:0;
  z-index:1;
}
#map{width:100%;height:100%;z-index:1;}
.leaflet-container{background:#0c0c09!important;}
.leaflet-tile{filter:brightness(0.85) saturate(1.1);}
 
/* badges over map */
.rec-badge{
  position:absolute;top:12px;left:12px;
  z-index:60;display:none;align-items:center;gap:7px;
  background:#00000080;backdrop-filter:blur(10px);
  border:1px solid var(--line3);border-radius:4px;padding:6px 12px;
}
.rec-dot{width:5px;height:5px;background:var(--red);border-radius:50%;animation:blink 1.6s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
.rec-txt{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);}
 
.paused-badge{
  position:absolute;top:12px;left:12px;
  z-index:60;display:none;align-items:center;gap:7px;
  background:#00000080;backdrop-filter:blur(10px);
  border:1px solid #d4c5a030;border-radius:4px;padding:6px 12px;
}
.paused-badge.show{display:flex;}
.paused-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;}
.paused-txt{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
 
.gps-pill{
  position:absolute;top:12px;right:12px;
  z-index:60;background:#00000080;backdrop-filter:blur(10px);
  border:1px solid var(--line3);border-radius:4px;padding:5px 10px;
  font-family:var(--mono);font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:5px;
}
.gps-dot-pill{width:5px;height:5px;border-radius:50%;background:var(--dim);}
.gps-dot-pill.ok{background:var(--green);animation:blink 2s infinite;}
.gps-dot-pill.err{background:var(--red);}
 
/* map re-center btn */
.map-recenter{
  position:absolute;bottom:12px;right:12px;z-index:60;
  width:36px;height:36px;background:#00000080;backdrop-filter:blur(10px);
  border:1px solid var(--line3);border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.map-recenter svg{fill:var(--mid);}
 
/* DATA PANEL */
.data-panel{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;background:var(--bg);
  padding:16px 22px 8px;
}
.data-panel::-webkit-scrollbar{display:none;}
 
/* speed */
.speed-row{display:flex;align-items:flex-end;gap:0;line-height:1;}
.speed-int{font-family:var(--mono);font-size:72px;font-weight:600;color:var(--white);letter-spacing:-4px;line-height:.95;}
.speed-dec{font-family:var(--mono);font-size:72px;font-weight:300;color:var(--dim);letter-spacing:-4px;line-height:.95;}
.speed-unit{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--mid);text-transform:uppercase;margin-left:8px;padding-bottom:10px;}
.speed-max{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px;}
 
/* metrics */
.mstrip{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;padding:12px 0;align-items:center;}
.vr{background:var(--line2);height:32px;}
.met{text-align:center;}
.met:first-child{text-align:left;}
.met:last-child{text-align:right;}
.mv{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--white);letter-spacing:-0.5px;line-height:1;}
.ml{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-top:4px;}
 
.rule{height:1px;background:var(--line);margin:0;}
 
/* spotify */
.sp-strip{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;}
.sp-thumb{width:34px;height:34px;border-radius:4px;background:var(--s3);border:1px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sp-info{flex:1;overflow:hidden;}
.sp-track{font-size:12.5px;font-weight:500;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-artist{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;}
.sp-ctrls{display:flex;gap:14px;align-items:center;flex-shrink:0;}
.sc{background:none;border:none;cursor:pointer;padding:2px;display:flex;align-items:center;}
.sc svg{fill:var(--dim);}
.sc.play svg{fill:var(--white);}
.sp-connect-btn{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid);background:var(--s2);border:1px solid var(--line2);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
 
/* actions */
.ride-actions{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;padding:12px 0 16px;align-items:center;}
.act-btn{height:46px;background:var(--s2);border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.act-btn:active{background:var(--s3);}
.act-btn.disabled{opacity:.3;pointer-events:none;}

/* Botón central dinámico */
.stop-btn{width:60px;height:60px;background:var(--s2);border:1px solid var(--line3);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.stop-btn:active{background:var(--s3);}
.stop-sq{width:16px;height:16px;background:var(--white);border-radius:2px;opacity:.8;}
.start-tri{width:0;height:0;border-top:10px solid transparent;border-left:16px solid var(--white);border-bottom:10px solid transparent;margin-left:4px;opacity:.8;}
 
/* GPS permission screen */
.gps-permission{
  position:absolute;inset:0;z-index:200;
  background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 32px;gap:20px;
  text-align:center;
}
.gps-permission svg{fill:var(--dim);opacity:.6;}
.gps-permission h2{font-family:var(--mono);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--white);font-weight:500;}
.gps-permission p{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);line-height:1.8;}
.gps-permission-btn{
  width:100%;max-width:280px;background:var(--white);color:var(--bg);
  font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  border:none;border-radius:6px;padding:14px;cursor:pointer;font-weight:600;margin-top:8px;
}
.gps-permission-deny{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:8px;}
 
/* ── HISTORY ── */
.hist-header{padding:16px 22px 12px;border-bottom:1px solid var(--line);}
.page-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.page-title{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--white);letter-spacing:-1px;}
.hist-title-row{display:flex;justify-content:space-between;align-items:center;}
.month-nav{display:flex;gap:8px;}
.mnav-btn{background:none;border:none;cursor:pointer;color:var(--dim);font-size:18px;padding:4px 10px;}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);}
.sum-cell{padding:12px 16px;border-right:1px solid var(--line);}
.sum-cell:last-child{border-right:none;}
.sv{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--white);letter-spacing:-0.5px;line-height:1;}
.su{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:2px;}
.sl{font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:4px;}
.ride-list{flex:1;overflow-y:auto;scrollbar-width:none;}
.ride-list::-webkit-scrollbar{display:none;}
.list-sec{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:12px 22px 8px;background:var(--bg);position:sticky;top:0;border-bottom:1px solid var(--line);}
.ride-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);cursor:pointer;}
.ride-row:active{background:var(--s1);}
.rbar{width:2px;background:var(--line2);flex-shrink:0;margin:14px 0;}
.rbar.pr{background:var(--accent);}
.rbody{flex:1;padding:12px 14px;}
.rdate{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.rname{font-size:14px;font-weight:400;color:var(--white);margin-bottom:6px;}
.rtags{display:flex;gap:5px;flex-wrap:wrap;}
.rtag{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);background:var(--s2);border:1px solid var(--line2);padding:2px 8px;border-radius:2px;}
.rtag.pr{color:var(--accent);background:#d4c5a010;border-color:#d4c5a025;}
.rright{padding:12px 16px 12px 8px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex-shrink:0;}
.rkm{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--white);letter-spacing:-1px;line-height:1;}
.rkmu{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:40px;}
.empty-state p{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-align:center;}
 
/* ── ANALYSIS ── */
.anal-header{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;}
.period-tog{display:flex;background:var(--s2);border:1px solid var(--line2);border-radius:4px;overflow:hidden;}
.pt{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;color:var(--dim);cursor:pointer;}
.pt.on{background:var(--s3);color:var(--white);}
.anal-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.anal-scroll::-webkit-scrollbar{display:none;}
.chart-sec{padding:16px 22px;border-bottom:1px solid var(--line);}
.cs-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.cs-val{font-family:var(--mono);font-size:32px;font-weight:500;color:var(--white);letter-spacing:-1.5px;line-height:1;}
.cs-unit{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:3px;}
.cs-delta{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:4px;letter-spacing:.5px;}
.cs-delta.neg{color:var(--red);}
.spark-wrap{margin-top:12px;}
.spark{width:100%;height:50px;display:block;}
.spark-labels{display:flex;justify-content:space-between;margin-top:5px;}
.slbl{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
.slbl.hi{color:var(--accent);}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:50px;margin-top:10px;}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.bb{width:100%;border-radius:2px 2px 0 0;background:var(--s3);border:1px solid var(--line2);border-bottom:none;}
.bb.hi{background:var(--accent);border-color:var(--accent);opacity:.85;}
.bl{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
.bl.hi{color:var(--accent);}
.stat4{display:grid;grid-template-columns:1fr 1fr;}
.s4c{padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.s4c:nth-child(2n){border-right:none;}
.s4c:nth-last-child(-n+2){border-bottom:none;}
.s4l{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.s4v{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--white);letter-spacing:-1px;line-height:1;}
.s4u{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:2px;}
.s4d{font-family:var(--mono);font-size:9.5px;color:var(--green);margin-top:4px;}
 
/* COMPARE section */
.compare-sec{padding:16px 22px;border-bottom:1px solid var(--line);}
.compare-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px;}
.cmp-sel{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;color:var(--mid);font-family:var(--mono);font-size:9px;letter-spacing:1px;outline:none;appearance:none;cursor:pointer;}
.cmp-vs{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.cmp-cards{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px;}
.cmp-card{background:var(--s2);padding:12px 14px;}
.cmp-card-name{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmp-metric{margin-bottom:8px;}
.cmp-metric-lbl{font-family:var(--mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:2px;}
.cmp-metric-val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--white);letter-spacing:-0.5px;line-height:1;}
.cmp-metric-val.win{color:var(--accent);}
.cmp-metric-u{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:2px;}
.cmp-bar-wrap{height:3px;background:var(--s3);border-radius:2px;margin-top:4px;}
.cmp-bar-fill{height:100%;border-radius:2px;background:var(--dim);}
.cmp-bar-fill.win{background:var(--accent);}
 
/* heatmap */
.heatmap{padding:16px 22px;border-bottom:1px solid var(--line);}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.hm-cell{aspect-ratio:1;border-radius:2px;background:var(--s3);}
.hm-cell.d1{background:#d4c5a025;}
.hm-cell.d2{background:#d4c5a055;}
.hm-cell.d3{background:#d4c5a085;}
.hm-cell.d4{background:#d4c5a0bb;}
.hm-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px;}
.hm-day{font-family:var(--mono);font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:center;}
 
/* ai */
.ai-block{margin:16px 18px 20px;background:var(--s2);border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
.ai-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
.ai-badge{width:24px;height:24px;border-radius:3px;background:var(--s3);border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--mid);}
.ai-hdr{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.ai-body{padding:14px 16px;font-size:12.5px;line-height:1.75;color:var(--mid);font-weight:300;}
.ai-body strong{color:var(--white);font-weight:400;}
.ai-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;}
.ai-footer-txt{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
.ai-loading{padding:14px 16px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);}
.ai-loading::after{content:'';animation:dots 1.2s infinite;}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
 
/* modals */
.modal-overlay{position:fixed;inset:0;z-index:200;background:#000000bb;display:none;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal{width:100%;background:var(--s1);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);padding:24px 22px max(24px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.modal-title{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:14px;}
.modal-speed{font-family:var(--mono);font-size:56px;font-weight:600;color:var(--white);letter-spacing:-3px;line-height:1;margin-bottom:2px;}
.modal-sub{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:18px;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px;}
.mg-cell{background:var(--s2);padding:12px 14px;}
.mg-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.mg-val{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--white);letter-spacing:-0.5px;}
.mg-u{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:2px;}

/* vs last ride */
.vs-banner{background:var(--s3);border:1px solid var(--line2);border-radius:6px;padding:12px 14px;margin-bottom:14px;display:none;}
.vs-banner.show{display:block;}
.vs-title{font-family:var(--mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.vs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.vs-item{}
.vs-lbl{font-family:var(--mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.vs-val{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:-0.5px;}
.vs-val.pos{color:var(--green);}
.vs-val.neg{color:var(--red);}
.vs-val.neu{color:var(--mid);}
.note-input{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:6px;padding:12px 14px;color:var(--white);font-family:var(--sans);font-size:13px;outline:none;resize:none;margin-bottom:14px;}
.note-input::placeholder{color:var(--dim);}
.modal-save{width:100%;background:var(--white);color:var(--bg);font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;border:none;border-radius:6px;padding:14px;cursor:pointer;font-weight:600;}
.modal-discard{width:100%;background:none;color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;border:none;padding:10px;cursor:pointer;margin-top:8px;}
 
/* detail map modal */
.map-modal{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;}
.map-modal.show{display:flex;}
